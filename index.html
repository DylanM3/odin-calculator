<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <!-- FONT EMBEDS -->
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Londrina+Shadow&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">

</head>
<body>
    <div id="calc-container">
        <div id="btn-container">
            <h1 id="title">Calculator</h1>
            <div class="row" id="row-1">
                <output id="screen"></output>
            </div>
            <div class="row" id="row-2">
                <button id="ansBtn"> Ans </button>
                <button id="clearBtn"> Clear </button>
                <button id="delBtn"> Delete </button>
                <button class="operator"> / </button>
            </div>
            <div class="row" id="row-3">
                <button class="digit"> 7 </button>
                <button class="digit"> 8 </button>
                <button class="digit"> 9 </button>
                <button class="operator"> * </button>
            </div>
            <div class="row" id="row-4">
                <button class="digit"> 4 </button>
                <button class="digit"> 5 </button>
                <button class="digit"> 6 </button>
                <button class="operator"> - </button>
            </div>
            <div class="row" id="row-5">
                <button class="digit"> 1 </button>
                <button class="digit"> 2 </button>
                <button class="digit"> 3 </button>
                <button class="operator"> + </button>
            </div>
            <div class="row" id="row6">
                <button class="digit"> 0 </button>
                <button class="digit"> . </button>
                <button id="equalsBtn"> = </button>
            </div>
        </div>
    </div>
</body>
<footer>
    <p></p> <!-- Added a non-breaking space character -->
    <a href="https://github.com/DylanM3" target="_blank" rel="noopener noreferrer">Created by Dylan Moore</a>
</footer>
</html>
